[project]
name = "orquestador-multiagente"
version = "0.1.0"
description = "Pre-entrega 6: orquestador multi-agente jerárquico (Supervisor + Investigador + Analista) con LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "pinecone>=7.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

# No es un paquete instalable: los módulos viven en la raíz y se importan desde ahí.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # langchain-community avisa que está en retirada; BM25Retriever todavía vive ahí.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
